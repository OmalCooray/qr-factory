[project]
name = "qr-factory"
version = "0.1.0"
description = "Quantitative research factory – MT5 data pipeline & backtesting toolkit"
requires-python = ">=3.12"
dependencies = [
    "MetaTrader5>=5.0.45",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "hmmlearn>=0.3",
    "ruptures>=1.1",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "xgboost>=2.0",
    "lightgbm>=4.0",
]

[project.optional-dependencies]
tracking = ["mlflow>=2.10"]

[project.scripts]
loader = "src.loader._loader:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
