symbol: "XAUUSD"
timeframe: "M5"
snapshot_dir: "data/20260217_030324"
starting_capital: 1000.0
output_dir: "runs"
position_size: 1.0

strategy:
  type: lorentzian_classification

  # Feature indicator periods
  rsi_period: 14
  rsi_short_period: 9
  cci_period: 20
  wt_n1: 10
  wt_n2: 11
  adx_period: 20
  ema_period: 200

  # Volatility filter ATR periods
  atr_short_period: 1
  atr_long_period: 10

  # KNN parameters
  neighbors_count: 8
  max_bars_back: 2000
  lookahead: 4

  # Kernel regression (Rational Quadratic + Gaussian)
  use_kernel_filter: true
  kernel_lookback: 8
  relative_weight: 8.0
  kernel_window: 64

  # Ehlers adaptive MA regime filter
  use_regime_filter: true
  regime_threshold: -0.1

  # Filters (matching Pine Script defaults)
  use_ema_filter: false      # kernel replaces EMA filter
  use_volatility_filter: true
  use_adx_filter: false      # disabled by default in Pine
  adx_threshold: 20.0
