symbol: "XAUUSD"
timeframe: "M5"
snapshot_dir: "data/20260217_030324"
starting_capital: 1000.0
output_dir: "runs"

strategy:
  type: ml_prob_threshold
  p_enter: 0.55
  fast_period: 5
  slow_period: 10

execution:
  spread_points: 40
  slippage_points: 10
  point_value: 0.01

label:
  type: return_sign_cost_aware
  horizon: 5
  price_col: close
  cost_buffer: 0.0003
  direction: up

model:
  type: logistic
  C: 1.0
  max_iter: 200
  class_weight: balanced

validation:
  type: walk_forward
  mode: expanding
  train_size: 100000
  test_size: 50000
  step: 50000
  drop_last: true
